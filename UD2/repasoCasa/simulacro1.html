<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        #formEvaluacion {
            background: #fff;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        #resultados {
            border: 3px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            background: #fff;
            transition: border-color 0.3s;
        }

        #cuentaAtras {
            font-size: 1.3em;
            font-weight: bold;
            color: #d9534f;
            margin-top: 15px;
        }
    </style>
    <script src="simulacro1.js" defer></script>
</head>

<body>
    <h1>Sistema de Gestión de Evaluaciones</h1>
    <div id="mostrarFecha"></div>

<form id="formEvaluacion">
    <label for="nombreAlumno">Nombre del Alumno:</label>
    <input type="text" id="nombreAlumno" placeholder="Ej: Juan Pérez" required>
    <button type="submit">Registrar Evaluación</button>
</form>


<div id="resultados">
    <h3>Panel de Control y Resultados</h3>
    <p id="mensajeFormulario">Introduce el nombre de un alumno y pulsa enviar.</p>
    <div id="datosProcesados"></div>
</div>

<div id="cuentaAtras">Tiempo restante: 10 s</div>
</body>

</html>
